<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<vbox
  id="zotero-prefpane-__addonRef__"
  onload="Zotero.__addonInstance__.hooks.onPrefsLoad(event)"
>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-service"></html:h2></label>
    <hbox align="center">
      <label data-l10n-id="pref-service-sentenceServices"></label>
      <!-- Replace -->
      <box id="__addonRef__-sentenceServices-placeholder"></box>
      <label data-l10n-id="pref-service-sentenceServicesSecret"></label>
      <html:input
        type="text"
        id="__addonRef__-sentenceServicesSecret"
      ></html:input>
      <button id="__addonRef__-sentenceServicesStatus"></button>
    </hbox>
    <label
      data-l10n-id="pref-service-hint"
      style="padding-left: 18px; margin-top: 8px; margin-bottom: 8px"
    ></label>
    <hbox align="center">
      <label data-l10n-id="pref-service-langfrom"></label>
      <!-- Replace -->
      <box id="__addonRef__-langfrom-placeholder"></box>
      <label data-l10n-id="pref-service-langto"></label>
      <!-- Replace -->
      <box id="__addonRef__-langto-placeholder"></box>
    </hbox>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-reading"></html:h2></label>
    <hbox align="center">
      <label
        control="__addonRef__-fontSize"
        data-l10n-id="pref-reading-fontSize"
      />
      <html:input
        id="__addonRef__-fontSize"
        type="number"
        min="8"
        max="40"
        step="1"
        style="width: 80px"
      />
      <label
        control="__addonRef__-lineHeight"
        data-l10n-id="pref-reading-lineHeight"
      />
      <html:input
        id="__addonRef__-lineHeight"
        type="number"
        min="1"
        max="3"
        step="0.1"
        style="width: 80px"
      />
    </hbox>
  </groupbox>
  <groupbox>
    <label><html:h2 data-l10n-id="pref-about"></html:h2></label>
    <label
      data-l10n-id="pref-about-version"
      data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
    ></label>
    <label
      data-l10n-id="pref-about-author"
      data-l10n-args='{"author": "__author__"}'
    ></label>
    <description
      data-l10n-id="pref-about-description"
      data-l10n-args='{"description": "__description__"}'
    ></description>
    <hbox align="center">
      <label
        data-l10n-id="pref-about-feedback"
        is="zotero-text-link"
        class="zotero-text-link"
        href="https://github.com/Kinetic27/zotero_paper_translate/issues"
        style="margin-right: 4px"
      ></label>
      <label
        data-l10n-id="pref-about-docs"
        is="zotero-text-link"
        class="zotero-text-link"
        href="__homepage__"
      ></label>
    </hbox>
    <hbox align="center">
      <label
        data-l10n-id="pref-about-upstream"
        is="zotero-text-link"
        class="zotero-text-link"
        href="https://github.com/windingwind/zotero-pdf-translate"
        style="margin-right: 4px"
      ></label>
      <label
        data-l10n-id="pref-about-license"
        is="zotero-text-link"
        class="zotero-text-link"
        href="https://github.com/Kinetic27/zotero_paper_translate/blob/HEAD/LICENSE"
      ></label>
    </hbox>
  </groupbox>
</vbox>
